# Copy this temporary HTTP-only config before requesting the first certificate.
# Replace every example.com before enabling it; then replace this file with
# newsday.conf after certbot has issued the certificate.
server {
    listen 80;
    server_name example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 404;
    }
}
